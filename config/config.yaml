# 1. 通信与模型路径配置
hardware: 
  serial_port: "/dev/ttyACM0" 
  model_path: "/home/lenzmj/ws/radar/ambution_radar_aim/openvino_model/best.xml" 

# 2. 相机内参 (基于你提供的最新标定数据)
camera: 
  fx: 20336.719976   
  fy: 20335.110626
  cx: 1533.592584
  cy: 1047.940073
  dist_coeffs: [1.132135, -97.156271, -0.001498, -0.001629, 0.0]

# 3. 目标物理尺寸 (单位: 米)
# 针对你提到的 13cm x 13cm 目标，建议将 width/height 设为 0.13
target: 
  width: 0.5 
  height: 0.65

# 4. 实时调参参数 
params: 
  # --- 检测器部分 ---
  # YOLO 置信度阈值。0.6 为平衡值，若目标经常闪烁可调低至 0.45
  conf_threshold: 0.6    
  
  # 图像角点平滑系数 (Alpha)。
  # 推荐值: 0.1 ~ 0.5。
  # 调小(0.1): 极其平滑，但移动时框会“飘”在后面；调大(0.4): 反应快，但画面抖动严重。
  det_alpha: 0.9         
  
  # --- 解算与控制部分 ---
  # 云台控制平滑系数。直接影响激光点的跟随速度。
  # 15米远距离时，若该值太小会导致严重的相位延迟。建议根据响应速度增加。
  # 推荐值: 0.15 ~ 0.35。
  solve_alpha: 0.20      
  
  # 判定“锁定”的角度误差范围 (度)。
  # 处于此范围内 solver 会将 cmd.is_locked 置为真，main 界面框变绿。
  lock_range: 0.5       

# 5. 结构偏移配置 (单位: 米)
# 用于补偿相机与云台轴心、激光笔(发射轴)之间的物理位移误差
offset:
# 相机相对于云台旋转中心的偏移 [x, y, z]
  cam_to_gimbal: [0.07, 0.03406, 0.0575]
  # 激光发射点相对于云台旋转中心的偏移
  ray_to_gimbal: [0.015, 0.00856, 0.055]
  
  
  
  
  
  
  
  
