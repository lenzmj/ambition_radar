

# -----------------------------------------------------------------------------
# 1. 硬件与推理
# -----------------------------------------------------------------------------
hardware:
  # 下位机串口（云台姿态 + 接收瞄准角）
  serial_port: "/dev/ttyACM0"
  # 推理后端：openvino | tensorrt（TensorRT 时 model_path 填 .engine）
  inference_backend: tensorrt

  # 我方红 -> 敌方蓝：blue_zmj.engine
  our_side: red
  model_path: "/home/lenzmj/ws/ambition_radar/model/blue_zmj.engine"

  # 我方蓝 -> 敌方红：red.engine
  #our_side: blue
  #model_path: "/home/lenzmj/ws/ambition_radar/model/red.engine"
  

# -----------------------------------------------------------------------------
# 2. 运行模式（二选一）
#   hik  — 海康实时：串口 + 解算 + 可选录制
#   test — 赛后复盘：只读 MP4 + YOLO 画框，不接相机、不录制
# ----------------------------------------------------------------------------
run:
  mode: hik

# 仅 run.mode: hik 时有效；输出 record_<时间戳>.mp4（YOLO 输入 BGR，无框）
dataset:
  record_dir: "/home/lenzmj/ws/ambition_radar/data/match"
  record_enabled: true
  record_max_fps: 30

# 仅 run.mode: test 时有效
test:
  video_path: "/home/lenzmj/ws/ambition_radar/data/match/vs西瓜大2.mp4"
  loop: true

# -----------------------------------------------------------------------------
# 3. 相机内参（标定结果）
# -----------------------------------------------------------------------------
camera:
  fx: 19132.540031
  fy: 19144.306803
  cx: 1320.015470
  cy: 1726.291619
  # 畸变系数 [k1, k2, p1, p2, k3]
  dist_coeffs: [0.593819, -9.999671, 0.024214, -0.008752, 0.0]
  # 曝光 (µs)、增益 (dB)；负数或不写则不改相机当前值
  exposure_time_us: 2500
  gain: 21.7
  # 海康相机序列号，用于 USB/GigE 枚举后连接
  camera_sn: "DA4568803"

# -----------------------------------------------------------------------------
# 4. 目标物理尺寸（PnP 解算用，单位：米）
# -----------------------------------------------------------------------------
target:
  width: 0.060   # 例如 60 mm 宽
  height: 0.065  # 例如 65 mm 高

# -----------------------------------------------------------------------------
# 5. 检测与解算调参
# -----------------------------------------------------------------------------
params:
  # --- YOLO 检测 ---
  conf_threshold: 0.87 # 置信度阈值，越高越不易误检、可能漏检
  det_alpha: 0.9        # 角点指数平滑，越大越跟手、越小越稳

  # --- EKF 位置预测 + 提前量瞄准 ---
  # 工况占比：~0.3 m/s 微动 ~400 s（主）| ~1 m/s 平移 ~10 s（次，可略滞后）
  ekf:
    predict_horizon_s: 0.177 # 提前瞄准 (s)；慢动少过冲；快移仍滞后可试 0.16~0.17
    default_dt_s: 0.0333     # 无有效时间戳时的帧间隔 (~30 fps)
    Q_pos: 0.02              # 过程噪声：位置
    Q_vel: 0.35              # 过程噪声：速度；略降，减轻慢动时 PnP 假速度
    R_pos: 0.10              # 量测噪声：PnP 位置；略升，压微动段抖动
    init_P_pos: 1.0
    init_P_vel: 10.0

  lock_range: 0.08    # 判定「锁定」的角度误差 (度)，远距可适当减小
  lock_beam_deg: 0.04 # 激光轴对准角阈值 (度)；-1 关闭
  lost_time: 0.7 # 连续未识别多久后发 mode=0 给下位机 (s)

  # --- 激光 IK 网格搜索（在初值附近搜最优 yaw/pitch）---
  ik_half_deg: 7.0        # 粗搜：相对初值 yaw/pitch 各向 ± 度数
  ik_coarse_step_deg: 1.4   # 粗搜步长 (度)
  ik_fine_passes: 2         # 细搜轮数
  ik_fine_half_deg: 1.75      # 细搜：当前最优附近 ± 度数
  ik_fine_step_deg: 0.07    # 细搜步长 (度)

# -----------------------------------------------------------------------------
# 6. 结构安装偏移（单位：米 / 度）
# -----------------------------------------------------------------------------
offset:
  # 相机光心相对云台旋转中心 [x前, y左, z上]
  #cam_to_gimbal: [-0.0000, 0.0, 0.08]
  # 激光口相对云台旋转中心
  #ray_to_gimbal: [-0.00706, 0.0, 0.1065]
  cam_to_gimbal: [-0.0000, -0.00, 0.08]
  ray_to_gimbal: [-0.00706, 0.0, 0.1065]
  # 相机系 -> 激光系，[roll, pitch, yaw] 单位度；机体 +X前 +Y左 +Z上
  # rpy_cam_to_ray: [0.000000, -1.112865, 2.796609]

  #rpy_cam_to_ray: [0.000000, 2.662945, 0.821411]
  rpy_cam_to_ray: [0.000000, 2.157781, 0.833969]





















