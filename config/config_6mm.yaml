# 1. 通信与模型路径配置
hardware: 

  serial_port: "/dev/ttyACM0" 
  # openvino | tensorrt . TensorRT 时使用 .engine 路径。
  inference_backend: tensorrt
 # model_path: "/home/lenzmj/ws/ambition_radar/openvino_model/red.xml" 
  model_path: "/home/lenzmj/ws/ambition_radar/openvino_model/best_trt.engine" 

# 2. 相机内参 
camera:
  fx: 2571.733658
  fy: 2571.231411
  cx: 1444.710774
  cy: 1088.514647
  
  # 畸变系数 [k1, k2, p1, p2, k3] 
  dist_coeffs: [-0.040624, 0.045286, 0.002100, -0.006427, 0.0]

  exposure_time_us: 2500
  gain: 11.7
  camera_sn: "DA4568803"

# 3. 目标物理尺寸 (单位: 米)
# 针对你提到的 60mm x 65mm 目标，必须修改此处 
target: 
  width: 0.060
  height: 0.065

# 4. 实时调参参数 
params: 
  # 典型工作距离约 15–19 m。下列角度阈值在地面/靶面上的投影可近似为：弧长 ≈ 斜距 × (角度×π/180)。
  # 例：19 m、0.3° → 约 0.10 m；19 m、0.12° → 约 4 cm（与 60 mm 板宽同量级时可作参考）。
  
  # --- 检测器部分 ---
  conf_threshold: 0.75
  
  # 图像角点平滑系数
  # 15–19 m 时像素抖动对角度的放大明显，可适当减小 det_alpha 换更稳的角点（更跟手则略增大）。
  det_alpha: 0.9         
  
  # --- 解算与控制部分 ---
  # 云台控制平滑系数。
  # 建议值: 0.1 ~ 0.2。值越小，激光跟随越稳，但会有滞后。 
  # 判定“锁定”的角度误差范围 (度)。与斜距成比例地换算到靶面位移再调；远距离过大会“假锁定”。
  lock_range: 0.3

  # 可选：>=0 时除 yaw/pitch 误差外，还要求当前姿态下激光发射轴与“激光口->目标”方向夹角小于该值（度）；-1 关闭。
  lock_beam_deg: -1

  # 激光轴 2 轴 IK（Rz*Ry）网格搜索：在角度域搜最优 yaw/pitch，与斜距基本无关；15–19 m 无需因距离改这组数。
  
  ik_half_deg: 42    #在初值 (chord_yaw, chord_pitch) 附近，粗搜时 yaw 和 pitch 各往正负方向最多偏多少度
                     #（例如 42 表示 yaw、pitch 都在 ±42° 矩形里搜）。初值来自「瞄准弦」在世界系里的方位，一般离真解不远；太大算得慢、太小可能搜不到最优。

  ik_coarse_step_deg: 2.0    #粗网格步长（度）。例如 2° 表示 yaw、pitch 每隔 2° 取一个格点。步长大：快但可能漏掉尖峰；步长小：更准但更慢。
  ik_fine_passes: 2          #细搜做几轮。每一轮都在「当前最好的一组角」附近再搜一小片，用来在粗格之间插细，提高角度分辨率。
  ik_fine_half_deg: 3.5      #每一轮细搜时，在当前最优角附近 ± 这个度数的小方块里搜（例如 ±3.5°）。
  ik_fine_step_deg: 0.15     #细网格步长（度），例如 0.15°，比粗网格密很多，用来把最优角「卡」得更准。
        

# 5. 结构偏移配置 (单位: 米)
# 注意：这些值是相机/激光相对于云台旋转中心的物理距离
offset:
  # [x, y, z] 相对于云台旋转中心的偏移量
  #x：前为正、后为负
  #y：左为正、右为负
  #z：上为正、下为负
  cam_to_gimbal: [-0.00001, 0.0, 0.08]
  ray_to_gimbal: [-0.00706, 0.0, 0.1065]
  # 相机系 -> 激光器系 的相对姿态，单位：度，顺序 [roll, pitch, yaw]。
  # 与 Solver 中 Eigen 机体一致：+X 前、+Y 左、+Z 上。
  # 正角度均为右手螺旋（右手四指沿旋转正向弯曲，大拇指沿对应坐标轴正方向）。

  rpy_cam_to_ray: [0.000000, -0.284831, 3.038267]
  
  
  
  
  
  
  
